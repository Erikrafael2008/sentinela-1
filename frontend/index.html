```html
<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">
    <h2>
      <img src="ff.png" width="85">
      Hospital Auria
    </h2>

    <input id="usuario" placeholder="Usuário">
    <input id="senha" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
  </div>

  <script>
    function login() {
      fetch("/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          usuario: document.getElementById("usuario").value,
          senha: document.getElementById("senha").value
        })
      })
      .then(r => r.json())
      .then(data => {
        if (data.tipo === "triagem") {
          location.href = "triagem.html";
        }

        if (data.tipo === "medico") {
          location.href = "medico.html";
        }

        if (data.tipo === "atendimento") {
          location.href = "atendimento.html";
        }
      })
      .catch(error => {
        console.error("Erro no login:", error);
        alert("Erro ao conectar com o servidor.");
      });
    }
  </script>
</body>
</html>
