<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midia-indoor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #5c4033;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .tv-container {
            display: flex;
            width: 95vw;
            height: 90vh;
            gap: 18px;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            width: 35%;
            gap: 18px;
        }

        .box {
            background-color: #63d4f2;
            border: 6px;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .box-title {
            color: #ffff;
            font-size: 2.2vw;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
            margin-bottom: 12px;
        }

        /*painel esquerdo - local (guiche ou consultorio)*/
        .local-box {
            flex: 1;
        }

        .local-number {
            color: #d12c2c;
            font-size: 9vw;
            font-weight: bold;
            line-height: 1;
        }

        .local-type {
            color: gray;
            font-size: 1.8vw;
            font-weight: bold;
            margin-top: 6px;

        }
        .history-box {
            flex: 1;
            justify-content: flex-start;
            align-items:flex-start ;
        
        }
        .history-box .box-title{
            font-size: 1.8vw;
            align-self:center;
        }
        #history-list {
            list-style: none;
            width: 100%;
            color: red;
            font-size: 1.5vw;
            font-weight: bold;
            text-align: left;
        }
        #history-list li{
            margin-bottom: 8px;
            border-bottom: 1px solid black;
            padding-bottom: 5px;
        }
        .patient-box{
            flex: 3;
            
        }
        .patient-name {
            color: red;
            font-size: 6.5vw;
            font-weight: bold;
            line-height: 1.2;
            word-break: break-word;
        }
        /*logo */
        .logo-box{flex: 1; }
        .logo-text{
            color: #8c3b7a;
            font-size: 3.5vw;
            font-weight: bold;
            text-transform: uppercase;
        }
        /*Animação de flash quando chama */
        @keyframes flash{
            0%, 100%{}
        }
    </style>
</head>

<body>




</body>

</html>
